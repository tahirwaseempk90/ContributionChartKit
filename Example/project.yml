# Generates ContributionChartExample.xcodeproj. The generated project is committed, so
# XcodeGen is only needed after changing this file: `cd Example && xcodegen generate`.
name: ContributionChartExample
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
    visionOS: "1.0"
packages:
  ContributionChart:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # Sign to run locally, so the app runs on a simulator or Mac without a development team.
    # To run on a physical device, choose a team under Signing & Capabilities.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  ContributionChartExample:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: ContributionChartExample
    dependencies:
      - package: ContributionChart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ContributionChartExample
        # Set per target because XcodeGen's platform preset would otherwise override it.
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: ContributionChartExample
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  ContributionChartExampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ContributionChartExampleUITests
    dependencies:
      - target: ContributionChartExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ContributionChartExampleUITests
        CODE_SIGN_IDENTITY: "-"
        # The app stays on the package's minimums, but current XCTest needs these to link.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  ContributionChartExample:
    build:
      targets:
        ContributionChartExample: all
        ContributionChartExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContributionChartExampleUITests
