name: Compatibility

# The CI workflow only sees the newest tools. This one runs the tests with the oldest Swift 6
# compiler and the oldest operating systems that GitHub's runners offer, because SwiftUI's
# behaviour can differ between OS versions in ways the compiler can't see.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS 14, Swift 6.0", runner: macos-14, xcode: "16.2" }
          - { name: "macOS 15, Swift 6.1", runner: macos-15, xcode: "16.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  package-tests:
    name: Package tests on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS 17.0, runner: macos-14, xcode: "16.2", destination: "platform=iOS Simulator,name=iPhone 15,OS=17.0.1" }
          - { name: iOS 18.6, runner: macos-15, xcode: "16.4", destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6" }
          - { name: Mac Catalyst on macOS 14, runner: macos-14, xcode: "16.2", destination: "platform=macOS,variant=Mac Catalyst" }
          - { name: tvOS 17.0, runner: macos-14, xcode: "16.2", destination: "platform=tvOS Simulator,name=Apple TV,OS=17.0" }
          - { name: watchOS 10.0, runner: macos-14, xcode: "16.2", destination: "platform=watchOS Simulator,name=Apple Watch SE (44mm) (2nd generation),OS=10.0" }
          - { name: visionOS 1.0, runner: macos-14, xcode: "16.2", destination: "platform=visionOS Simulator,name=Apple Vision Pro,OS=1.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Test
        env:
          DESTINATION: ${{ matrix.destination }}
        run: xcodebuild test -scheme ContributionChart -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

  # These runtimes aren't preinstalled on any runner, so this downloads them.
  declared-minimums:
    name: Package tests on ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS 16.4, runtime: "iOS 16.4", runtime-id: "iOS16.4", device: "iPhone 14", destination: "platform=iOS Simulator,name=Minimum,OS=16.4" }
          - { name: tvOS 16.4, runtime: "tvOS 16.4", runtime-id: "tvOS16.4", device: "Apple TV", destination: "platform=tvOS Simulator,name=Minimum,OS=16.4" }
          - { name: watchOS 9.4, runtime: "watchOS 9.4", runtime-id: "watchOS9.4", device: "Apple Watch SE (44mm) (2nd generation)", destination: "platform=watchOS Simulator,name=Minimum,OS=9.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Install the simulator
        env:
          RUNTIME: ${{ matrix.runtime }}
          RUNTIME_ID: ${{ matrix.runtime-id }}
          DEVICE: ${{ matrix.device }}
        run: |
          xcodes runtimes install "$RUNTIME"
          xcrun simctl list runtimes
          xcrun simctl create Minimum "$DEVICE" "$RUNTIME_ID"
      - name: Test
        env:
          DESTINATION: ${{ matrix.destination }}
        run: xcodebuild test -scheme ContributionChart -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO

  example:
    name: Example app and UI tests on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS 17.0, artifact: ui-tests-ios-17, runner: macos-14, xcode: "16.2", destination: "platform=iOS Simulator,name=iPhone 15,OS=17.0.1" }
          - { name: iOS 18.6, artifact: ui-tests-ios-18, runner: macos-15, xcode: "16.4", destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6" }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build for macOS
        run: >
          xcodebuild build -project Example/ContributionChartExample.xcodeproj
          -scheme ContributionChartExample -destination "platform=macOS"
      - name: Run UI tests
        env:
          DESTINATION: ${{ matrix.destination }}
        run: >
          xcodebuild test -project Example/ContributionChartExample.xcodeproj
          -scheme ContributionChartExample -destination "$DESTINATION"
          -resultBundlePath ui-tests.xcresult
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ui-tests.xcresult
