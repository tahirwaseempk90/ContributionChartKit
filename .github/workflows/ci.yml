name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Naming the shell turns on `pipefail`. Without it, `Scripts/coverage.sh 99 | tee coverage.txt`
# would report the exit status of `tee`, and low coverage could never fail the job.
defaults:
  run:
    shell: bash

# SwiftUI only exists on Apple platforms, so every job needs a macOS runner. The package can't
# be built or tested on Linux. See Documentation/Testing.md.
jobs:
  package:
    name: Build, test, and measure coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test and enforce coverage
        run: Scripts/coverage.sh 99 | tee coverage.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  platforms:
    name: Compile for ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS, destination: "generic/platform=iOS" }
          - { name: iOS Simulator, destination: "generic/platform=iOS Simulator" }
          - { name: Mac Catalyst, destination: "platform=macOS,variant=Mac Catalyst" }
          - { name: tvOS Simulator, destination: "generic/platform=tvOS Simulator" }
          - { name: watchOS Simulator, destination: "generic/platform=watchOS Simulator" }
          - { name: visionOS Simulator, destination: "generic/platform=visionOS Simulator" }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: >
          xcodebuild build -scheme ContributionChart
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  ios-unit-tests:
    name: Unit tests on iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: >
          xcodebuild test -scheme ContributionChart
          -destination "platform=iOS Simulator,id=$(python3 Scripts/first-simulator.py iPhone)"
          CODE_SIGNING_ALLOWED=NO

  example:
    name: Build the example and run UI tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the committed project matches project.yml
        run: |
          brew install xcodegen
          cd Example
          xcodegen generate
          git diff --exit-code -- ContributionChartExample.xcodeproj/project.pbxproj
      - name: Build for macOS
        run: >
          xcodebuild build -project Example/ContributionChartExample.xcodeproj
          -scheme ContributionChartExample -destination "platform=macOS"
      - name: Build for visionOS Simulator
        run: >
          xcodebuild build -project Example/ContributionChartExample.xcodeproj
          -scheme ContributionChartExample -destination "generic/platform=visionOS Simulator"
      - name: Run UI tests on iOS Simulator
        run: >
          xcodebuild test -project Example/ContributionChartExample.xcodeproj
          -scheme ContributionChartExample
          -destination "platform=iOS Simulator,id=$(python3 Scripts/first-simulator.py iPhone)"
          -resultBundlePath ui-tests.xcresult
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests
          path: ui-tests.xcresult

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
