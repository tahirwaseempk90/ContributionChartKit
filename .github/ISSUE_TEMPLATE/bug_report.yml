name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows the problem
      description: The smaller the better, ideally with the data and the frame you're using.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "iOS 26.2, iPhone 17"
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: "26.6"
    validations:
      required: true
